name: "[TIP] - Visitor Gadget"
version: 0.1.0
description: Widget đếm "Lượt xem trang" và "Số khách ghé thăm" dạng ô số ở footer, loại trừ lượt ghé của admin.
icon: eye
author:
  name: tipforeveryone
keywords: visitor counter, page views, hit counter, footer
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool
    digits:
      type: number
      label: Số chữ số hiển thị
      help: Số ô số hiển thị cho mỗi con số (đệm số 0 phía trước nếu chưa đủ). Mặc định 6.
      default: 6
      validate:
        min: 1
        max: 12
    visitor_cookie_days:
      type: number
      label: Số ngày ghi nhớ "khách cũ"
      help: Cookie định danh khách để không đếm trùng "khách ghé thăm" trong khoảng thời gian này. Mặc định 365 ngày.
      default: 365
      validate:
        min: 1
    initial_page_views:
      type: number
      label: Số lượt xem cộng thêm
      help: Cộng thêm vào số lượt xem THỰC đã đếm được (trong stats.json) mỗi khi hiển thị ra ngoài trang — đổi số này áp dụng ngay, không ảnh hưởng số thực đang đếm. Dùng nút "Reset bộ đếm" phía dưới để đưa số thực về lại 0.
      default: 0
      validate:
        min: 0
    initial_unique_visitors:
      type: number
      label: Số khách ghé thăm cộng thêm
      help: Cộng thêm vào số khách ghé thăm THỰC đã đếm được (trong stats.json) mỗi khi hiển thị ra ngoài trang — đổi số này áp dụng ngay, không ảnh hưởng số thực đang đếm. Dùng nút "Reset bộ đếm" phía dưới để đưa số thực về lại 0.
      default: 0
      validate:
        min: 0
    reset_action:
      type: visitor-gadget-reset
      label: Số liệu & Reset bộ đếm
      help: Bảng số thực (stats.json) / số cộng thêm (cấu hình) / tổng hiện ra ngoài widget. Nút Reset chỉ đặt số thực về 0, không đụng số cộng thêm — bấm là chạy ngay, không cần bấm Save sau đó.
    likes_enabled:
      type: toggle
      label: Bật khối Like/Dislike cuối bài viết
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool
    like_cookie_days:
      type: number
      label: Số ngày ghi nhớ lựa chọn like/dislike
      help: Cookie ghi nhớ phản ứng (like/dislike) của khách cho từng bài viết, để tô sáng đúng nút và cho phép đổi ý/bỏ chọn. Mặc định 365 ngày.
      default: 365
      validate:
        min: 1
